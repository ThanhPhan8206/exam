<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dc2626">
  <meta name="description"
    content="Đăng nhập & Đăng ký tài khoản - Hệ thống Quản lý Đề thi và Luyện thi Trực tuyến EXAM">
  <title>Đăng nhập & Đăng ký | Hệ thống Quản lý Đề thi EXAM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/print.css" media="print">
</head>

<body class="auth-page">

  <main class="auth-card-centered" id="authCard">
    
    <div class="auth-top-bar">
      <a href="home.html" class="btn-back-home" title="Quay lại trang chủ">
        <i class="fas fa-arrow-left"></i> Trang chủ
      </a>
      <div class="auth-brand-badge">
        <div class="brand-icon-geom">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <span class="brand-name">EXAM</span>
      </div>
    </div>

    <header class="auth-card-header">
      <h2 id="authHeaderTitle">Chào Mừng Trở Lại</h2>
      <p id="authHeaderSubtitle">Hệ thống Luyện thi & Quản lý Đề thi Trực tuyến</p>
    </header>

    <nav class="auth-segmented-tabs" aria-label="Tabs xác thực">
      <button type="button" class="auth-tab-btn active" id="tabLoginBtn">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập
      </button>
      <button type="button" class="auth-tab-btn" id="tabRegisterBtn">
        <i class="fas fa-user-plus"></i> Đăng ký
      </button>
    </nav>

    <form id="loginForm" novalidate>
      
      <div class="form-group">
        <label class="form-label" for="loginEmail">Địa chỉ Email <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="loginEmail" class="form-control" placeholder="email@utc.edu.vn" autocomplete="email"
            required>
        </div>
        <span class="form-error" id="loginEmailError"></span>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Mật khẩu <span
              class="required">*</span></label>
          <a href="#" style="font-size: var(--font-xs); color: #dc2626; font-weight: 700;"
            onclick="alert('Vui lòng liên hệ Quản trị viên hệ thống để khôi phục mật khẩu!')">Quên mật khẩu?</a>
        </div>
        <div class="input-icon-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••"
            autocomplete="current-password" required>
          <button type="button" class="btn-toggle-password" data-target="loginPassword" aria-label="Hiện mật khẩu">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <span class="form-error" id="loginPasswordError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLoginSubmit" style="margin-top: 1.25rem;">
        <i class="fas fa-arrow-right"></i> Đăng Nhập Hệ Thống
      </button>
    </form>

    <form id="registerForm" style="display: none;" novalidate>
      
      <div class="form-group">
        <label class="form-label" for="regName">Họ và Tên <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="regName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
        </div>
        <span class="form-error" id="regNameError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Địa chỉ Email <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="regEmail" class="form-control" placeholder="email@utc.edu.vn" required>
        </div>
        <span class="form-error" id="regEmailError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regRole">Vai Trò Người Dùng <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-user-tag input-icon"></i>
          <select id="regRole" class="form-control" required style="cursor: pointer; appearance: auto;">
            <option value="student" selected>Học sinh / Thí sinh</option>
            <option value="teacher">Giáo viên / Giảng viên</option>
          </select>
        </div>
        <span class="form-error" id="regRoleError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Mật khẩu (tối thiểu 6 ký tự) <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-password" data-target="regPassword" aria-label="Hiện mật khẩu">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <span class="form-error" id="regPasswordError"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirmPassword">Xác nhận mật khẩu <span class="required">*</span></label>
        <div class="input-icon-wrapper">
          <i class="fas fa-shield-alt input-icon"></i>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="••••••••" required>
          <button type="button" class="btn-toggle-password" data-target="regConfirmPassword" aria-label="Hiện mật khẩu">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <span class="form-error" id="regConfirmPasswordError"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnRegisterSubmit"
        style="margin-top: 1.25rem;">
        <i class="fas fa-user-plus"></i> Hoàn Tất Đăng Ký
      </button>
    </form>

    <footer class="auth-card-footer">
      <p>&copy; 2026 Hệ thống Quản lý Đề thi EXAM • Bài tập lớn môn Thiết kế Web.</p>
    </footer>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
</body>

</html>
